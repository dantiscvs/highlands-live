<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #e6edf3; min-height: 100vh; }
a { color: #58a6ff; text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
.card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
details summary { list-style: none; cursor: pointer; }
details summary::-webkit-details-marker { display: none; }
.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; font-size: 13px; font-weight: 500; transition: background .15s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: #30363d; }
.btn-g { background: #196c2e; border-color: #238636; color: #56d364; }
.btn-g:hover { background: #238636; color:#fff; }
.av { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; border: 2px solid #30363d; color: #8b949e; background: #21262d; user-select: none; flex-shrink: 0; }
.av.on { border-color: var(--ac); color: var(--ac); background: var(--abg); }
.sh { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.day-hdr { display: flex; align-items: flex-start; justify-content: space-between; padding: 14px 16px; gap: 12px; }
.chev { transition: transform .2s; color: #8b949e; flex-shrink: 0; margin-top: 4px; }
details[open] .chev { transform: rotate(180deg); }
.tt { font-size: 26px; font-weight: 800; }
.ts { font-size: 13px; color: #8b949e; margin-top: 4px; }
.hero { background: linear-gradient(rgba(13,17,23,0.72), rgba(13,17,23,0.88)), url('img/hero.jpg') center/cover; border: 1px solid #30363d; border-radius: 16px; padding: 32px 20px; text-align: center; margin-bottom: 16px; position: relative; overflow: hidden; color: #fff; }
.hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 80% 20%, rgba(86,211,100,0.12), transparent 55%); pointer-events: none; }
.status-line { margin-top: 10px; font-size: 14px; font-weight: 600; position: relative; }
.cd { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-top: 18px; position: relative; }
.cd-box { background: rgba(13,17,23,0.6); border: 1px solid #30363d; border-radius: 10px; padding: 10px 6px; }
.cd-v { font-size: 22px; font-weight: 800; color: #56d364; line-height: 1; }
.cd-l { font-size: 10px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
.pbar { height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; margin-top: 8px; }
.pbar > div { height: 100%; background: linear-gradient(to right,#238636,#56d364); border-radius: 4px; transition: width .3s; }
.map-marker { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 10px; }
.gallery-item img { width: 100%; height: 120px; object-fit: cover; display: block; }
footer { text-align: center; color: #8b949e; font-size: 12px; margin: 24px 0 8px; }
@media(max-width:500px){ .tt{font-size:22px;} .cd-v{font-size:18px;} }
</style>
</head>

const PL = { dan:'Michał', kuba:'Kuba', maciek:'Maciek' };
const PC = { dan:'#56d364', kuba:'#79c0ff', maciek:'#d2a8ff' };
const PBG = { dan:'#0d4a2e', kuba:'#0c2d6b', maciek:'#2d1f5e' };

const PUB_URL = 'https://evlmgtoysvcumluwmusa.supabase.co';
const PUB_KEY = 'sb_publishable_EBGf9roabpx5-brXuia6ug_YWkOVc4K';
const pub = supabase.createClient(PUB_URL, PUB_KEY);

let progress = { day: null, ridden_km: 0, total_km: 513 };
let livetrack = [];
let updates = [];

async function loadLiveData() {
  try {
    const [pRes, lRes, uRes] = await Promise.all([
      pub.from('progress').select('*').eq('id', 'current').maybeSingle(),
      pub.from('livetrack').select('*'),
      pub.from('updates').select('*').order('created_at', { ascending: false }),
    ]);
    if (pRes.data) progress = pRes.data;
    if (lRes.data) livetrack = lRes.data;
    if (uRes.data) updates = uRes.data;
  } catch (e) { console.warn('loadLiveData:', e.message); }
}

function esc(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function effortScore(km, el) {
  const eff = km + el/100;
  const raw = eff / 12;
  const score = Math.min(10, Math.max(0, raw));
  let label, color;
  if (score < 3)        { label = 'Bardzo łatwy';  color = '#56d364'; }
  else if (score < 5)   { label = 'Łatwy';         color = '#7ee787'; }
  else if (score < 7)   { label = 'Umiarkowany';   color = '#79c0ff'; }
  else if (score < 8.5) { label = 'Trudny';        color = '#ffa657'; }
  else if (score < 9.5) { label = 'Bardzo trudny'; color = '#ff7b72'; }
  else                  { label = 'Ekstremalny';   color = '#f85149'; }
  return { eff, score, label, color };
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371, toRad = Math.PI/180;
  const dLat = (lat2-lat1)*toRad, dLon = (lon2-lon1)*toRad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*toRad)*Math.cos(lat2*toRad)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function rideSplitIndex(pts, targetKm) {
  let acc = 0;
  for (let i=1; i<pts.length; i++) {
    acc += haversineKm(pts[i-1][0], pts[i-1][1], pts[i][0], pts[i][1]);
    if (acc >= targetKm) return i;
  }
  return pts.length - 1;
}

function cumulativeKm(p) {
  if (!p.day) return 0;
  let sum = 0;
  for (const d of DAYS) { if (d.km && d.day < p.day) sum += d.km; }
  return sum + (p.ridden_km || 0);
}

function computePhase() {
  const now = new Date();
  const start = new Date('2026-08-05T00:00:00');
  const end = new Date('2026-08-13T00:00:00');
  if (now < start) return { phase:'before', daysTo: Math.ceil((start-now)/86400000) };
  if (now >= end) return { phase:'after' };
  return { phase:'during' };
}

function renderHero() {
  const st = computePhase();
  const box = document.getElementById('heroDayBox');
  const line = document.getElementById('statusLine');
  if (st.phase === 'before') {
    box.textContent = '–';
    line.textContent = `🕓 Start za ${st.daysTo} ${st.daysTo === 1 ? 'dzień' : 'dni'}`;
  } else if (st.phase === 'after') {
    box.textContent = '✓';
    line.textContent = '🏁 Wyprawa zakończona';
  } else {
    box.textContent = progress.day || '–';
    line.textContent = progress.day ? `🚴 W trasie — dzień ${progress.day} z 8` : '🚴 Ruszamy na trasę';
  }
}

function renderProgress() {
  const el = document.getElementById('progressBody');
  const total = 513.4;
  const done = cumulativeKm(progress);
  const pct = Math.min(100, (done/total)*100);
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-size:13px;color:#8b949e;margin-bottom:4px;">
      <span>${progress.day ? `Dzień ${progress.day} z 8` : 'Przed startem'}</span>
      <span>${done.toFixed(0)} / ${Math.round(total)} km</span>
    </div>
    <div class="pbar"><div style="width:${pct}%;"></div></div>
    ${progress.note ? `<div style="font-size:12px;color:#8b949e;margin-top:8px;">${esc(progress.note)}</div>` : ''}
  `;
}

function renderLive() {
  const el = document.getElementById('liveBody');
  const active = livetrack.filter(l => l.active && l.url);
  if (!active.length) {
    el.innerHTML = `
      <div style="display:flex;gap:8px;margin-bottom:10px;">${PS.map(p=>`<div class="av" title="${PL[p]}">${PL[p][0]}</div>`).join('')}</div>
      <div style="font-size:13px;color:#8b949e;">Brak aktywnych transmisji na żywo w tej chwili.</div>`;
    return;
  }
  el.innerHTML = active.map(l => `
    <a href="${esc(l.url)}" target="_blank" rel="noopener" class="btn btn-g" style="margin:0 8px 8px 0;">
      <span class="av on" style="--ac:${PC[l.id]};--abg:${PBG[l.id]};width:20px;height:20px;font-size:10px;">${(PL[l.id]||'?')[0]}</span>
      ${PL[l.id] || l.id} — na żywo →
    </a>`).join('');
}

function renderGallery() {
  const el = document.getElementById('galleryBody');
  if (!updates.length) {
    el.innerHTML = `<div style="text-align:center;padding:20px 0;color:#8b949e;font-size:13px;">📷 Zdjęcia z trasy pojawią się tutaj, gdy ruszymy na trasę.</div>`;
    return;
  }
  el.innerHTML = `<div class="gallery-grid">${updates.map(u => `
    <div class="card gallery-item" style="margin-bottom:0;">
      <img src="${esc(u.photo_url)}" loading="lazy">
      <div style="padding:8px;">
        <div style="font-size:12px;">${esc(u.caption||'')}</div>
        <div style="font-size:11px;color:#8b949e;margin-top:2px;">${esc(u.author||'')} · ${new Date(u.created_at).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})}</div>
      </div>
    </div>`).join('')}</div>`;
}

function buildElevationSpark(day) {
  const pts = ROUTES[day];
  if (!pts) return '';
  const eles = pts.map(p => p[2]);
  const min = Math.min(...eles), max = Math.max(...eles);
  const w = 300, h = 56, pad = 4;
  const range = (max-min) || 1;
  const stepX = (w-2*pad) / (eles.length-1);
  const coords = eles.map((e,i) => [pad + i*stepX, h-pad - ((e-min)/range)*(h-2*pad)]);
  const line = coords.map(c => c.join(',')).join(' ');
  const areaPath = `M${pad},${h-pad} L${line} L${w-pad},${h-pad} Z`;
  const color = STAGE_COLORS[day] || '#56d364';
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:52px;display:block;">
    <path d="${areaPath}" fill="${color}" opacity="0.15"></path>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline>
  </svg>`;
}

function buildMap() {
  const W = 600, H = 680, pad = 28;
  let minLat=90, maxLat=-90, minLon=180, maxLon=-180;
  for (const day in ROUTES) for (const [lat,lon] of ROUTES[day]) {
    if (lat<minLat) minLat=lat; if (lat>maxLat) maxLat=lat;
    if (lon<minLon) minLon=lon; if (lon>maxLon) maxLon=lon;
  }
  const cosLat = Math.cos((minLat+maxLat)/2 * Math.PI/180);
  const lonSpan = (maxLon-minLon)*cosLat || 1;
  const latSpan = (maxLat-minLat) || 1;
  const drawW = W-2*pad, drawH = H-2*pad;
  const scale = Math.min(drawW/lonSpan, drawH/latSpan);
  const offX = pad + (drawW - lonSpan*scale)/2;
  const offY = pad + (drawH - latSpan*scale)/2;
  const project = ([lat,lon]) => [offX + (lon-minLon)*cosLat*scale, offY + (maxLat-lat)*scale];

  let marker = '';
  const parts = Object.keys(ROUTES).map(dayStr => {
    const day = parseInt(dayStr,10);
    const pts = ROUTES[day];
    const proj = pts.map(project);
    const color = STAGE_COLORS[day] || '#8b949e';
    let svg = `<polyline points="${proj.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (progress.day && day <= progress.day) {
      const endIdx = day < progress.day ? pts.length-1 : rideSplitIndex(pts, progress.ridden_km || 0);
      const doneProj = proj.slice(0, endIdx+1);
      if (doneProj.length > 1) {
        svg += `<polyline points="${doneProj.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      if (day === progress.day) {
        marker = `<circle class="map-marker" cx="${proj[endIdx][0]}" cy="${proj[endIdx][1]}" r="7" fill="${color}" stroke="#0d1117" stroke-width="2"/>`;
      }
    }
    return svg;
  }).join('');

  const legend = Object.keys(ROUTES).map(dayStr => {
    const day = parseInt(dayStr,10);
    const d = DAYS.find(x => x.day === day);
    const dest = d ? d.title.split('→').pop().trim() : '';
    return `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#8b949e;margin-right:12px;">
      <span style="width:9px;height:9px;border-radius:50%;background:${STAGE_COLORS[day]};display:inline-block;"></span>Dzień ${day} · ${esc(dest)}
    </span>`;
  }).join('');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;">${parts}${marker}</svg>
    <div style="margin-top:10px;line-height:2;">${legend}</div>`;
}

function renderStages() {
  const el = document.getElementById('stagesBody');
  el.innerHTML = DAYS.map(d => {
    const header = `
      <summary><div class="day-hdr">
        <div style="display:flex;gap:10px;align-items:flex-start;">
          <div style="font-size:22px;">${d.ico}</div>
          <div>
            <div style="font-weight:800;font-size:15px;">${esc(d.title)}</div>
            <div style="font-size:12px;color:#8b949e;margin-top:2px;">${d.date} · ${d.dow}</div>
          </div>
        </div>
        <div class="chev">▾</div>
      </div></summary>`;
    if (!d.km) {
      return `<details class="card" style="border-left:4px solid #30363d;">${header}
        <div style="padding:0 16px 16px;font-size:13px;color:#c9d1d9;">${esc(d.desc)}</div>
      </details>`;
    }
    const eff = effortScore(d.km, d.el);
    return `<details class="card" style="border-left:4px solid ${eff.color};">${header}
      <div style="padding:0 16px 16px;">
        <div style="font-size:13px;color:#c9d1d9;margin-bottom:12px;">${esc(d.desc)}</div>
        <div class="cd" style="grid-template-columns:repeat(3,1fr);">
          <div class="cd-box"><div class="cd-v">${d.km}</div><div class="cd-l">km</div></div>
          <div class="cd-box"><div class="cd-v">${d.el}</div><div class="cd-l">m ⛰️</div></div>
          <div class="cd-box"><div class="cd-v" style="color:${eff.color};">${eff.score.toFixed(1)}</div><div class="cd-l">${eff.label}</div></div>
        </div>
        <div style="margin-top:12px;">${buildElevationSpark(d.day)}</div>
      </div>
    </details>`;
  }).join('');
}

function renderAll() {
  renderHero();
  renderProgress();
  renderLive();
  document.getElementById('mapWrap').innerHTML = buildMap();
  renderGallery();
}

async function init() {
  renderAll();
  renderStages();
  await loadLiveData();
  renderAll();
  setInterval(async () => {
    await loadLiveData();
    renderAll();
  }, 60000);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
